# Базовый запуск: PostgreSQL → роли и базы → миграции → загрузка набора → сервис и заглушка
# ТОиР. Облако не нужно.
# Секреты берутся из .env; без него compose останавливается и называет переменную.
# Создать .env со случайными секретами: `make run`.

name: oes-assistant

# Тег образа не задан намеренно: у каждого проекта compose свои образы, и запуск
# локального CI не подменяет образ под работающим `make run`.
x-app: &app
  build:
    context: .
    target: runtime

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?не задан POSTGRES_PASSWORD — создайте .env командой make run}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      # Проверка по сети, а не по сокету: во время инициализации образ поднимает
      # временный сервер, который слушает только сокет и которому верить нельзя.
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 60s
      start_interval: 1s
    mem_limit: 768m
    restart: unless-stopped

  # Три разовых шага перед сервисом; каждый стартует после успешного завершения предыдущего.

  # Роли и базы. Единственный шаг с паролем администратора сервера.
  bootstrap:
    <<: *app
    command: ["python", "-m", "assistant.ingest", "bootstrap"]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?не задан POSTGRES_PASSWORD — создайте .env командой make run}
      DATABASE_OWNER_URL: ${DATABASE_OWNER_URL:?не задан DATABASE_OWNER_URL — создайте .env командой make run}
      DATABASE_URL: ${DATABASE_URL:?не задан DATABASE_URL — создайте .env командой make run}
      TOIR_DATABASE_URL: ${TOIR_DATABASE_URL:?не задан TOIR_DATABASE_URL — создайте .env командой make run}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # Миграции схемы и права роли сервиса. Тот же шаг — `make migrate` и шаг деплоя.
  migrate:
    <<: *app
    command: ["python", "-m", "assistant.ingest", "migrate"]
    environment:
      DATABASE_OWNER_URL: ${DATABASE_OWNER_URL:?не задан DATABASE_OWNER_URL — создайте .env командой make run}
      DATABASE_URL: ${DATABASE_URL:?не задан DATABASE_URL — создайте .env командой make run}
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    restart: "no"

  # Загрузка набора. Миграции не применяет: на отставшей схеме останавливается.
  loader:
    <<: *app
    command: ["python", "-m", "assistant.ingest", "load"]
    environment:
      DATABASE_OWNER_URL: ${DATABASE_OWNER_URL:?не задан DATABASE_OWNER_URL — создайте .env командой make run}
      DATA_DIR: /data
    volumes:
      - type: bind
        source: ${DATA_DIR:-./data}
        target: /data
        read_only: true
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  assistant:
    <<: *app
    command: ["uvicorn", "assistant.api.app:create_app", "--factory", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?не задан DATABASE_URL — создайте .env командой make run}
      TOIR_URL: ${TOIR_URL:-http://toir:8001}
      TOIR_TOKEN: ${TOIR_TOKEN:?не задан TOIR_TOKEN — создайте .env командой make run}
      # Пустые значения допустимы: сервис стартует, ход завершится с outcome: error.
      MODEL_BASE_URL: ${MODEL_BASE_URL:-}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      MODEL_NAME: ${MODEL_NAME:-}
      MODEL_MAX_OUTPUT_TOKENS: ${MODEL_MAX_OUTPUT_TOKENS:-}
      MODEL_TIMEOUT_SECONDS: ${MODEL_TIMEOUT_SECONDS:-}
      MODEL_RESPONSE_FORMAT: ${MODEL_RESPONSE_FORMAT:-}
      MODEL_EXTRA_BODY: ${MODEL_EXTRA_BODY:-}
      MODEL_TOKEN_CHARS: ${MODEL_TOKEN_CHARS:-}
      # Задаёт make; при docker compose up без make — пусто.
      GIT_COMMIT: ${GIT_COMMIT:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      # Пустые значения — умолчания сервиса.
      MAX_MESSAGE_CHARS: ${MAX_MESSAGE_CHARS:-}
      TURN_TIMEOUT_SECONDS: ${TURN_TIMEOUT_SECONDS:-}
      SESSION_LEASE_SECONDS: ${SESSION_LEASE_SECONDS:-}
    ports:
      - "${SERVICE_BIND:-127.0.0.1}:${SERVICE_PORT:-8000}:8000"
    extra_hosts:
      # Модель на машине разработчика: localhost внутри контейнера — это сам контейнер.
      - "host.docker.internal:host-gateway"
    depends_on:
      loader:
        condition: service_completed_successfully
    healthcheck: &http-ready
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
      start_interval: 1s
    mem_limit: 768m
    restart: unless-stopped

  toir:
    <<: *app
    command: ["uvicorn", "toir_stub.app:create_app", "--factory", "--host", "0.0.0.0", "--port", "8001"]
    environment:
      TOIR_DATABASE_URL: ${TOIR_DATABASE_URL:?не задан TOIR_DATABASE_URL — создайте .env командой make run}
      TOIR_TOKEN: ${TOIR_TOKEN:?не задан TOIR_TOKEN — создайте .env командой make run}
    # Порт наружу не публикуется: заглушка нужна только сервису и прогону.
    depends_on:
      loader:
        condition: service_completed_successfully
    healthcheck:
      <<: *http-ready
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8001/healthz', timeout=2)"]
    mem_limit: 192m
    restart: unless-stopped

  # Наблюдаемость: трассы, метрики и журнал в одном контейнере — Grafana, Tempo, Mimir, Loki
  # и сборщик OpenTelemetry (решение 9). Только с профилем observability: базовый запуск
  # остаётся лёгким. Сервис шлёт телеметрию на lgtm:4318, если задан OTEL_EXPORTER_OTLP_ENDPOINT;
  # `make observe` задаёт его сам. Порт на хосте — только на локальном адресе; на стенде
  # Grafana открывается через прокси по пути /grafana/, со своим входом (решения 23 и 24),
  # выкатка включает профиль по STAND_OBSERVABILITY. Данные живут внутри контейнера.
  lgtm:
    image: grafana/otel-lgtm:0.34.0
    profiles: ["observability"]
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    environment:
      # Grafana отдаёт себя с подпути: так её адреса совпадают и с прокси, и локально.
      # Внешний адрес нужен ей для ссылок и проверки Origin у Live; на стенде его задаёт
      # выкатка из STAND_DOMAIN. Вход — свой, Grafana (решение 24): анонимного входа нет,
      # администратор — из .env, пароль случайный из make-env, а не admin/admin образа;
      # на стенд оба уходят из локального .env. Вход
      # по заголовку выключен: только форма и сессия. Внешних снимков нет: дашборд не
      # уходит на сторонний сервис.
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://127.0.0.1:${GRAFANA_PORT:-3000}/grafana/}
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      GF_AUTH_BASIC_ENABLED: "false"
      GF_SNAPSHOTS_EXTERNAL_ENABLED: "false"
      # Блокировка после неудачных входов — по имени пользователя, а он один и известен:
      # любой из интернета держал бы admin запертым. Подбор пароля из make-env нереален и так.
      GF_SECURITY_DISABLE_BRUTE_FORCE_LOGIN_PROTECTION: "true"
    # Без пароля или с меткой вместо него не стартует: иначе Grafana завела бы admin/admin
    # или пароль, известный из .env.example. Команда образа та же.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        case "$$GF_SECURITY_ADMIN_PASSWORD" in
        ""|*__GENERATE__*) echo "lgtm: GRAFANA_ADMIN_PASSWORD пуст или метка — запусти make-env" >&2; exit 1 ;;
        esac;
        exec /otel-lgtm/run-all.sh
    mem_limit: 1200m
    restart: unless-stopped

  # Обратный прокси стенда: страница и API по имени из STAND_DOMAIN и по HTTPS, вход по
  # паролю. Только с профилем proxy: базовый запуск работает без домена и облака. Порты 80 и
  # 443 нужны Let's Encrypt для проверки домена; снаружи их пропускает группа безопасности.
  # Сервис и заглушка ТОиР наружу по-прежнему не публикуются — только через прокси.
  proxy:
    image: caddy:2.11.4-alpine
    profiles: ["proxy"]
    ports:
      - "${PROXY_HTTP_PORT:-80}:80"
      - "${PROXY_HTTPS_PORT:-443}:443"
    environment:
      STAND_DOMAIN: ${STAND_DOMAIN:-}
      PROXY_USER: ${PROXY_USER:-demo}
      PROXY_PASSWORD: ${PROXY_PASSWORD:-}
    # Хэш пароля считается при старте: в .env лежит сам пароль, а хэш с символами «$»
    # сломал бы подстановку переменных compose. Из окружения процесса Caddy пароль затем
    # убирается; в настройках контейнера он остаётся, как и остальные секреты сервиса. В
    # хэширование пароль идёт через stdin встроенной командой оболочки: в аргументах процесса
    # он виден был бы всем на хосте.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        test -n "$$STAND_DOMAIN" && test -n "$$PROXY_PASSWORD"
        || { echo "proxy: нужны STAND_DOMAIN и PROXY_PASSWORD" >&2; exit 1; };
        PROXY_PASSWORD_HASH="$$(printf '%s\n' "$$PROXY_PASSWORD" | caddy hash-password)" || exit 1;
        export PROXY_PASSWORD_HASH; unset PROXY_PASSWORD;
        exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    volumes:
      - ./infra/proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Сертификаты переживают пересоздание контейнера: иначе каждый запуск — новый запрос
      # к Let's Encrypt и его лимиты.
      - proxy-data:/data
    depends_on:
      assistant:
        condition: service_healthy
    mem_limit: 128m
    restart: unless-stopped

  # Разовые команды: запускаются целями make, в `docker compose up` не участвуют.

  datagen:
    <<: *app
    profiles: ["tools"]
    command: ["python", "-m", "datagen"]
    network_mode: none
    volumes:
      - ./data:/app/data

  evalrun:
    <<: *app
    profiles: ["tools"]
    command: ["python", "-m", "evalrun"]
    environment:
      ASSISTANT_URL: http://assistant:8000
      TOIR_URL: http://toir:8001
      TOIR_TOKEN: ${TOIR_TOKEN:?не задан TOIR_TOKEN — создайте .env командой make run}
      PRICE_INPUT: ${PRICE_INPUT:-}
      PRICE_CACHED: ${PRICE_CACHED:-}
      PRICE_OUTPUT: ${PRICE_OUTPUT:-}
      EVAL_ATTEMPTS: ${EVAL_ATTEMPTS:-}
      DATA_DIR: /data
      QUESTIONS: /questions/${QUESTIONS_FILE:-questions.jsonl}
      EVAL_DIR: /app/eval
      # LLM-судья — только командами judge-check и judge.
      JUDGE_MODEL: ${JUDGE_MODEL:-}
      # Адрес и ключ судьи; пусто — адрес и ключ модели сервиса, ключ — только вместе с адресом.
      JUDGE_BASE_URL: ${JUDGE_BASE_URL:-}
      JUDGE_API_KEY: ${JUDGE_API_KEY:-}
      MODEL_BASE_URL: ${MODEL_BASE_URL:-}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      JUDGE_EXTRA_BODY: ${JUDGE_EXTRA_BODY:-}
      JUDGE_PRICE_INPUT: ${JUDGE_PRICE_INPUT:-}
      JUDGE_PRICE_OUTPUT: ${JUDGE_PRICE_OUTPUT:-}
    volumes:
      - type: bind
        source: ${QUESTIONS_DIR:-${DATA_DIR:-./data}}
        target: /questions
        read_only: true
      - type: bind
        source: ${DATA_DIR:-./data}
        target: /data
        read_only: true
      - ./eval:/app/eval

volumes:
  pgdata:
  proxy-data:
